apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passport-status-db-cn
  labels:
    app.kubernetes.io/name: passport-status-db-cn
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  data:
    - secretKey: username
      remoteRef:
        key: PassportStatusAPI/env/prod
        property: postgresql-username
    - secretKey: password
      remoteRef:
        key: PassportStatusAPI/env/prod
        property: postgresql-password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passport-status-dynatrace
  labels:
    app.kubernetes.io/name: passport-status-dynatrace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  data:
    - secretKey: metrics-read-token
      remoteRef:
        key: dynatrace
        property: metrics-read-token

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passport-status-sharepoint
  labels:
    app.kubernetes.io/name: passport-status-sharepoint
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  data:
    - secretKey: SP_EXPORT_CLIENT_CERT_PFX
      remoteRef:
        key: sharepoint
        property: SP_EXPORT_CLIENT_CERT_PFX
    - secretKey: SP_EXPORT_CLIENT_CERT_PFX_PASSWORD
      remoteRef:
        key: sharepoint
        property: SP_EXPORT_CLIENT_CERT_PFX_PASSWORD
    - secretKey: SP_EXPORT_USER
      remoteRef:
        key: sharepoint
        property: SP_EXPORT_USER
